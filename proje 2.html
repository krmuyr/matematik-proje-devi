<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kerem Uyar | Circuit Master Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #fbbf24;
            --bg: #020617;
            --panel: #1e293b;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Kerem Uyar Başlık Bölümü */
        #author-header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: linear-gradient(to bottom, #1e1b4b, transparent);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            margin-bottom: 20px;
        }

        #author-header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        #author-header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 2px;
        }

        /* Oyun Alanı */
        #game-stage {
            position: relative;
            width: 900px;
            height: 450px;
            background: var(--panel);
            border-radius: 24px;
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .circuit-path {
            position: absolute;
            width: 750px;
            height: 280px;
            border: 8px solid #475569;
            border-radius: 40px;
            z-index: 1;
        }

        .components {
            display: flex;
            width: 100%;
            justify-content: space-around;
            align-items: center;
            z-index: 2;
            padding: 0 60px;
        }

        /* Dinamik Elemanlar */
        .battery-grid, .bulb-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bulb {
            width: 50px;
            height: 50px;
            background: #334155;
            border-radius: 50%;
            border: 3px solid #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .battery {
            width: 35px;
            height: 60px;
            background: #ef4444;
            border-radius: 6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            border: 2px solid #991b1b;
        }

        /* UI Paneli */
        #ui {
            margin-top: 30px;
            display: flex;
            gap: 40px;
        }

        .control-card {
            background: var(--panel);
            padding: 15px 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 5px;
        }

        .btn-add { background: var(--primary); color: white; }
        .btn-rem { background: #334155; color: #94a3b8; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }

        .meter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            border: 1px solid var(--primary);
        }

        .val { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div id="author-header">
    <h1>KEREM UYAR</h1>
    <p>ADVANCED CIRCUIT SIMULATOR v2.0</p>
</div>

<div id="game-stage">
    <div class="meter">
        ⚡ VOLTAJ: <span id="v-val" class="val">1.5</span>V<br>
        🔌 AKIM: <span id="i-val" class="val">0.15</span>A<br>
        💡 DİRENÇ: <span id="r-val" class="val">10</span>Ω
    </div>

    <div class="circuit-path"></div>
    
    <div class="components">
        <div id="battery-box" class="battery-grid"></div>
        <div style="font-size: 2rem; opacity: 0.3">🔌</div>
        <div id="bulb-box" class="bulb-grid"></div>
    </div>
</div>

<div id="ui">
    <div class="control-card">
        <div style="margin-bottom:10px; font-size:0.8rem; color:#94a3b8">GÜÇ KAYNAĞI (PİL)</div>
        <button class="btn btn-rem" onclick="update('bat', -1)">-</button>
        <button class="btn btn-add" onclick="update('bat', 1)">+</button>
    </div>
    
    <div class="control-card">
        <div style="margin-bottom:10px; font-size:0.8rem; color:#94a3b8">YÜK (AMPUL)</div>
        <button class="btn btn-rem" onclick="update('bulb', -1)">-</button>
        <button class="btn btn-add" onclick="update('bulb', 1)">+</button>
    </div>
</div>

<script>
    let state = { bat: 1, bulb: 1 };

    function render() {
        const V = state.bat * 1.5;
        const R = state.bulb * 10;
        const I = V / R;

        // Verileri Yazdır
        document.getElementById('v-val').innerText = V.toFixed(1);
        document.getElementById('r-val').innerText = R;
        document.getElementById('i-val').innerText = I.toFixed(2);

        // Pilleri Çiz
        const batBox = document.getElementById('battery-box');
        batBox.innerHTML = '';
        for(let i=0; i<state.bat; i++) {
            batBox.innerHTML += '<div class="battery">+</div>';
        }

        // Ampulleri Çiz
        const bulbBox = document.getElementById('bulb-box');
        bulbBox.innerHTML = '';
        for(let i=0; i<state.bulb; i++) {
            const b = document.createElement('div');
            b.className = 'bulb';
            
            // Parlaklık Ayarı: Akım düştükçe parlaklık azalır
            const power = Math.min(I * 80, 100);
            if(I > 0.02) {
                b.style.background = `radial-gradient(circle, #fff 0%, #fbbf24 ${100-power}%, #334155 100%)`;
                b.style.boxShadow = `0 0 ${power/2}px ${power/4}px rgba(251, 191, 36, ${I})`;
                b.style.borderColor = '#fff';
            }
            bulbBox.appendChild(b);
        }
    }

    function update(type, val) {
        state[type] = Math.max(1, Math.min(state[type] + val, 6));
        render();
    }

    render();
</script>

</body>
</html>
